[project]
name = "enph-cuadernillo2"
version = "1.0.0"
description = "ENPH Cuadernillo 2 urbano: API FastAPI con datos en memoria u Oracle (esquema ENPH)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "oracledb>=2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.13,<3"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
