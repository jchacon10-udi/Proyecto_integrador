[project]
name = "enph-demo"
version = "0.1.0"
description = "Inicio ENPH cliente-servidor; datos ficticios en memoria, sin Oracle"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.13,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
